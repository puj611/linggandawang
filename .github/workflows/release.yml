name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：universal 二进制同时覆盖 Apple Silicon 与 Intel，产物 dmg
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'
          # Linux：deb + AppImage（覆盖 tauri.conf.json 默认 targets）
          - platform: ubuntu-latest
            args: '--bundles deb,appimage'
          # Windows：沿用 tauri.conf.json 配置的 NSIS 安装包
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # TODO(@xenova): @xenova/transformers 被 src/lib/vectorStore.ts 动态导入，
      # 但尚未声明进 package.json / package-lock.json；vite build 会解析该导入，
      # 缺失时直接失败。待依赖正式入库（npm install @xenova/transformers）后删除本步骤。
      - name: Install undeclared runtime dependency (@xenova/transformers)
        run: npm install @xenova/transformers@2.17.2 --no-save

      # tauri.conf.json 的 beforeBuildCommand 为空，必须显式构建前端产物
      - name: Build frontend
        run: npm run build

      # Task 18 自动更新说明：
      # - tauri.conf.json 已设 bundle.createUpdaterArtifacts=true，构建时为各平台产物生成 .sig 签名文件
      # - tauri-action@v0 没有 includeUpdater 输入；其 uploadUpdaterJson（默认 true）会在
      #   检测到签名产物时自动生成并上传 latest.json 到 release assets，
      #   对应 tauri.conf.json 中 endpoints 的
      #   https://github.com/<你的用户名>/linggandawang/releases/latest/download/latest.json
      # - 签名密钥（一次性生成，本机执行）：
      #     npx @tauri-apps/cli signer generate -w ~/.tauri/linggan.key
      #   私钥文件内容（或路径）→ 仓库 Secret TAURI_SIGNING_PRIVATE_KEY；
      #   生成时设置了密码才需要 TAURI_SIGNING_PRIVATE_KEY_PASSWORD。
      #   注意：未配置该 Secret 前打 tag，构建会因缺少私钥失败（先完成密钥配置再发版），
      #   完整流程见 docs/reference/release-process.md
      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: '灵感大王 v__VERSION__'
          releaseBody: '安装包在 Assets 中下载，变更说明见 CHANGELOG.md。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
